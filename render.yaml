services:
  # ---------- Backend: Laravel API (Docker) ----------
  - type: web
    name: erp-backend
    runtime: docker
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: ./apps/backend
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      # القيم دي هتحطها انت يدويًا في Render Dashboard بعد ما تعمل قاعدة بيانات على Supabase
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SANCTUM_STATEFUL_DOMAINS
        sync: false
      # Render بينهي SSL عند البروكسي، فمن غير ده الروابط المولّدة بتطلع http
      - key: FORCE_HTTPS
        value: "true"

  # ---------- Frontend: React (Static Site) ----------
  - type: web
    name: erp-frontend
    runtime: static
    buildCommand: cd apps/frontend && npm install && npm run build
    staticPublishPath: ./apps/frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
